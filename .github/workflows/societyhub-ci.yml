```yaml
name: SocietyHub CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Verify Java Backend
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: societyhub-backend/pom.xml

      - name: Verify backend
        working-directory: societyhub-backend
        run: mvn -B --no-transfer-progress clean verify

      - name: Upload backend WAR
        uses: actions/upload-artifact@v4
        with:
          name: societyhub-backend-war
          path: societyhub-backend/target/societyhub.war
          if-no-files-found: error
          retention-days: 7

  frontend:
    name: Lint and Build React Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: societyhub-frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: societyhub-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build

      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: societyhub-frontend-dist
          path: societyhub-frontend/dist/
          if-no-files-found: error
          retention-days: 7
```
